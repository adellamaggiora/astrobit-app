<style>
:root {
  color-scheme: light;
  --paper:#F5F6F8; --surface:#FFFFFF; --ink:#151A23; --muted:#566074; --rule:#D8DDE6;
  --accent:#1D3C94; --accent-ink:#FFFFFF; --accent-soft:#E7ECF9;
  --lv1:#D3D9E9; --lv2:#A7B6DF; --lv3:#7B92D1; --lv4:#4A66B8; --lv5:#1D3C94;
  --ok:#1F6B49; --ok-bg:#E3F2EA; --warn:#7F5200; --warn-bg:#FAEFD6; --bad:#9A2125; --bad-bg:#F8E2E2;
  --s1:#2a78d6; --s2:#eb6834; --edge:rgba(86,96,116,.38); --edge-hi:#1D3C94;
  --serif:"LMR","Latin Modern Roman","CMU Serif",Georgia,serif;
  --sans:"LMR","Latin Modern Roman","CMU Serif",Georgia,serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --paper:#0E1117; --surface:#161B24; --ink:#E7EAF0; --muted:#9AA4B5; --rule:#2B3242;
    --accent:#9DB3FF; --accent-ink:#0E1117; --accent-soft:#1D2540;
    --lv1:#2A3350; --lv2:#3B4B80; --lv3:#5870BD; --lv4:#7F97E0; --lv5:#B3C3FF;
    --ok:#7FD1A6; --ok-bg:#16291F; --warn:#E8C171; --warn-bg:#2B2210; --bad:#F2A0A3; --bad-bg:#2E1618;
    --s1:#3987e5; --s2:#d95926; --edge:rgba(154,164,181,.34); --edge-hi:#9DB3FF;
  }
}
* { box-sizing:border-box; }
html { scroll-padding-top:8px; }
body { margin:0; background:var(--paper); color:var(--ink); font:16.5px/1.5 var(--sans); font-kerning:normal; font-variant-ligatures:common-ligatures;
  padding:8px max(16px,env(safe-area-inset-right,0px)) 56px max(16px,env(safe-area-inset-left,0px)); }
button { font:inherit; color:inherit; cursor:pointer; }
input,select { font:inherit; color:inherit; }
:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
[hidden] { display:none !important; }
.wrap { max-width:1180px; margin:0 auto; }
.muted { color:var(--muted); } .tn { font-variant-numeric:tabular-nums; }
h1 { font:italic 400 2rem/1.1 var(--serif); margin:0; letter-spacing:.01em; }
h2.sec { font:italic 400 1.35rem var(--serif); margin:0 0 10px; }
h3.sub2 { font:600 .72rem/1 var(--sans); text-transform:uppercase; letter-spacing:.12em; color:var(--muted); margin:0 0 10px; }
.lab { font:600 .72rem/1 var(--sans); text-transform:uppercase; letter-spacing:.12em; color:var(--muted); margin:0 0 10px; }

/* header */
.top { display:flex; flex-direction:column; gap:12px; padding-bottom:14px; }
.brand { display:flex; flex-wrap:wrap; gap:10px 20px; align-items:flex-end; justify-content:space-between; }
.status { display:flex; gap:10px; align-items:center; }
/* barra dei filtri: tutti i comandi alla stessa altezza, sulla stessa riga */
.fbar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; --h:38px; }
.fbar > * { display:flex; }
.fbar .search input, .fbar .seg, .fbar .cpick > summary { height:var(--h); box-sizing:border-box; }
.fbar .seg button { height:100%; display:inline-flex; align-items:center; }
.fbar { position:relative; }

@media (max-width:600px) { .fbar .cpick { position:static; } .fbar .cpanel { left:0; right:0; width:auto; } .fbar .search { flex-basis:100%; max-width:none; } }
.gstat { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.gpair { margin:0 0 10px; display:flex; flex-direction:column; gap:6px; background:var(--surface); border:1px solid var(--accent); border-radius:6px; padding:8px 12px; font-size:.9rem; }

.gpair.fixed { height:7.6em; overflow:auto; }
.gpair.fixed .plist { max-height:none; }
.phead { display:flex; flex-wrap:wrap; gap:4px 12px; align-items:baseline; }
.plist { margin:0; padding:0 0 0 1.6em; max-height:220px; overflow:auto; }
.plist li { padding:3px 4px; border-radius:4px; line-height:1.6; }
.plist li:hover { background:var(--accent-soft); }
.patom { background:none; border:0; padding:0; font:inherit; color:var(--accent); text-decoration:underline; text-underline-offset:2px; cursor:pointer; }
.parr { color:var(--muted); margin:0 .45em; }
.gcmd { margin:6px 0 0; font-size:.78rem; line-height:1.4; color:var(--muted); }

.fline { display:flex; flex-wrap:wrap; gap:6px 8px; align-items:center; font-size:.85rem; color:var(--muted); }

.fchip { display:inline-flex; align-items:center; gap:6px; padding:2px 4px 2px 10px; border-radius:999px; background:var(--accent-soft); color:var(--ink); border:0; font:inherit; }
.fchip b { font-weight:500; } .fchip span { display:inline-flex; width:22px; height:22px; align-items:center; justify-content:center; border-radius:50%; color:var(--muted); }
.fchip:hover span { background:var(--surface); color:var(--ink); }
.gctl { display:inline-flex; align-items:center; gap:6px; } .gctl select.sel { padding:5px 8px; min-height:34px; }
.sub { margin:4px 0 0; color:var(--muted); font-size:.85rem; }
.tools { display:flex; flex-wrap:wrap; gap:8px 12px; align-items:center; font-size:.875rem; }
.search { position:relative; flex:1 1 240px; max-width:360px; }
.search input { width:100%; padding:7px 12px; border:1px solid var(--rule); border-radius:6px; background:var(--surface); }
.sugg { position:absolute; z-index:30; left:0; right:0; top:100%; margin-top:4px; background:var(--surface); border:1px solid var(--rule); border-radius:6px; box-shadow:0 6px 24px rgba(0,0,0,.14); max-height:340px; overflow:auto; }

.seg { display:inline-flex; border:1px solid var(--rule); border-radius:6px; overflow:hidden; background:var(--surface); }

.seg button:last-child { border-right:0; }

select.sel { padding:6px 10px; border:1px solid var(--rule); border-radius:6px; background:var(--surface); max-width:240px; }
.pill { display:inline-flex; align-items:center; gap:8px; padding:3px 10px; border:1px solid var(--rule); border-radius:999px; background:var(--surface); font-size:.82rem; }
.pill i { width:8px; height:8px; border-radius:50%; background:var(--ok); flex:none; }

.pill.err i { background:var(--bad); } .pill.off i { background:var(--muted); }
@keyframes pulse { 50% { opacity:.25; } }
.ghost { background:none; border:1px solid var(--rule); border-radius:6px; padding:5px 12px; }
.ghost:hover { border-color:var(--accent); color:var(--accent); }

.ghost[disabled] { opacity:.45; cursor:default; border-color:var(--rule); color:inherit; }
.solid { background:var(--accent); color:var(--accent-ink); border:0; border-radius:6px; padding:8px 16px; font-weight:600; }
.linkbtn { background:none; border:0; padding:0; color:var(--accent); text-decoration:underline; text-underline-offset:2px; }
nav.tabs { display:flex; gap:0; border-bottom:1px solid var(--ink); margin:6px 0 24px; overflow-x:auto; overflow-y:hidden; scrollbar-width:none; }
nav.tabs::-webkit-scrollbar { display:none; }
nav.tabs button { background:none; border:0; padding:9px 16px; font:600 .78rem/1 var(--sans); text-transform:uppercase; letter-spacing:.1em; color:var(--muted); border-bottom:3px solid transparent; margin-bottom:-1px; white-space:nowrap; }
nav.tabs button[aria-selected="true"] { color:var(--ink); border-bottom-color:var(--accent); }
nav.tabs button:hover { color:var(--ink); }
nav.tabs .gback { margin-left:auto; align-self:center; margin-bottom:3px; flex:none; display:inline-flex; align-items:center; gap:6px; padding:5px 14px; border:1px solid var(--rule); border-radius:6px; background:var(--surface); color:var(--ink); font:500 .9rem/1.2 var(--sans); text-transform:none; letter-spacing:0; white-space:nowrap; cursor:pointer; }

/* chips, tags, dots */
.chips { display:flex; flex-wrap:wrap; gap:6px; }
.chip { background:var(--surface); border:1px solid var(--rule); border-radius:999px; padding:3px 11px; font-size:.84rem; }
.chip .c { color:var(--muted); margin-left:4px; font-variant-numeric:tabular-nums; }
.chip[aria-pressed="true"] { background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
.chip[aria-pressed="true"] .c { color:inherit; opacity:.8; }
.tag { display:inline-block; padding:1px 8px; border-radius:3px; font-size:.74rem; font-weight:600; letter-spacing:.02em; background:var(--accent-soft); color:var(--accent); white-space:nowrap; }
.tag.warn { background:var(--warn-bg); color:var(--warn); } .tag.bad { background:var(--bad-bg); color:var(--bad); } .tag.ok { background:var(--ok-bg); color:var(--ok); }
.dots { display:inline-flex; gap:3px; vertical-align:middle; }
.dots i { width:8px; height:8px; border-radius:50%; border:1px solid var(--accent); }
.dots i.on { background:var(--accent); }
/* icona atomo: emoji della tipologia (come su Notion) su un cerchio; il colore del cerchio dice se è validato */
.glyph { display:inline-flex; align-items:center; justify-content:center; width:20px; height:20px; margin-right:7px; vertical-align:-4px; border-radius:50%; flex:none;
  font-size:11px; line-height:1; font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
  background:color-mix(in srgb, var(--s1) 20%, var(--surface)); box-shadow:inset 0 0 0 1.5px var(--s1); }
.glyph.b { background:color-mix(in srgb, var(--s2) 20%, var(--surface)); box-shadow:inset 0 0 0 1.5px var(--s2); }
.glyph.none { font-size:0; }
.note { font-size:.8rem; color:var(--muted); margin:0; }

/* layout with rail */
.layout { display:grid; grid-template-columns:260px minmax(0,1fr); gap:36px; align-items:start; }
aside.rail { display:flex; flex-direction:column; gap:22px; min-width:0; }
.stack { display:flex; flex-direction:column; gap:28px; min-width:0; }
.opts { display:flex; flex-direction:column; border-top:1px solid var(--rule); }
.opt { display:grid; grid-template-columns:1fr auto; gap:2px 8px; text-align:left; background:none; border:0; border-bottom:1px solid var(--rule); padding:8px 8px; }
.opt:hover, .opt[aria-checked="true"] { background:var(--accent-soft); }
.opt[aria-checked="true"] .n { font-weight:600; } .opt .c { color:var(--muted); font-variant-numeric:tabular-nums; }
.mini { grid-column:1/-1; display:flex; height:4px; gap:1px; margin-top:4px; background:var(--rule); }
.mini i { display:block; height:100%; }
.vseg { display:flex; flex-direction:column; border:1px solid var(--rule); border-radius:6px; overflow:hidden; background:var(--surface); }
.vseg button { background:none; border:0; border-bottom:1px solid var(--rule); text-align:left; padding:8px 12px; display:flex; justify-content:space-between; gap:8px; }
.vseg button:last-child { border-bottom:0; }
.vseg button[aria-pressed="true"] { background:var(--accent); color:var(--accent-ink); }
.vseg .c { opacity:.75; font-variant-numeric:tabular-nums; }
.fopts { display:flex; flex-wrap:wrap; gap:10px 20px; align-items:center; }
@media (max-width:600px) { .fopts .seg { width:100%; } .fopts .seg button { flex:1 1 0; padding:6px 6px; } }
.switch { display:inline-flex; gap:8px; align-items:center; cursor:pointer; font-size:.875rem; }
.switch input { accent-color:var(--accent); width:16px; height:16px; margin:0; }

/* stats */
.stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(110px,1fr)); border-top:1px solid var(--ink); border-bottom:1px solid var(--rule); }
.stat { padding:10px 12px 10px 0; display:flex; flex-direction:column; gap:2px; }
.stat + .stat { padding-left:14px; border-left:1px solid var(--rule); }
.stat .k { font:600 .68rem/1.2 var(--sans); text-transform:uppercase; letter-spacing:.1em; color:var(--muted); }
.stat .v { font:400 1.6rem/1.1 var(--serif); font-variant-numeric:tabular-nums; }
.stat .v small { font-size:.85rem; color:var(--muted); }
.bar { display:flex; height:10px; gap:2px; background:var(--rule); margin-top:12px; }
.bar i { display:block; height:100%; }
.legend { display:flex; flex-wrap:wrap; gap:4px 16px; margin-top:6px; font-size:.8rem; color:var(--muted); }
.legend span { display:inline-flex; align-items:center; gap:6px; } .legend b { width:10px; height:10px; display:inline-block; }

/* course grid */
.cgrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:14px; }
.ccard { text-align:left; background:var(--surface); border:1px solid var(--rule); border-radius:6px; padding:16px 18px 14px; display:flex; flex-direction:column; gap:8px; }
.ccard:hover { border-color:var(--accent); }
.ccard h3 { font:400 1.2rem/1.25 var(--serif); margin:0; }
.ccard .meta { display:flex; flex-wrap:wrap; gap:4px 12px; font-size:.82rem; color:var(--muted); }
.ccard .meta b { color:var(--ink); font-weight:600; font-variant-numeric:tabular-nums; }
.ccard.empty { opacity:.6; }
.yearh { font:italic 400 1.05rem var(--serif); color:var(--muted); margin:22px 0 10px; padding-bottom:4px; border-bottom:1px solid var(--rule); }
.yearh:first-child { margin-top:0; }

/* course page */
.crumb { display:flex; flex-wrap:wrap; gap:8px 16px; align-items:center; justify-content:space-between; margin-bottom:14px; }
details.sect { background:var(--surface); border:1px solid var(--rule); border-radius:6px; }
details.sect + details.sect { margin-top:10px; }
details.sect > summary { cursor:pointer; list-style:none; padding:11px 16px; display:flex; gap:12px; align-items:baseline; font:400 1.12rem/1.3 var(--serif); }
details.sect > summary::-webkit-details-marker { display:none; }
details.sect > summary::before { content:"▸"; font-size:.8rem; color:var(--muted); transition:transform .12s; }
details.sect[open] > summary::before { transform:rotate(90deg); }
details.sect > summary .cnt { margin-left:auto; font:400 .82rem var(--sans); color:var(--muted); }
.arow { display:grid; grid-template-columns:minmax(0,1fr) auto auto; gap:4px 14px; align-items:center; width:100%; text-align:left; background:none; border:0; border-top:1px solid var(--rule); padding:7px 16px; }
.arow:hover { background:var(--accent-soft); }
.arow .t { font:400 1rem/1.35 var(--serif); display:flex; align-items:baseline; min-width:0; }
.arow .t span.tt { overflow-wrap:anywhere; }
.arow .x { font-size:.78rem; color:var(--muted); font-variant-numeric:tabular-nums; white-space:nowrap; }
.rgroup { margin-bottom:14px; }
.rlist { border-top:1px solid var(--rule); }
.rrow { display:flex; gap:12px; align-items:center; justify-content:space-between; padding:7px 4px; border-bottom:1px solid var(--rule); font-size:.92rem; }
.rrow a { color:var(--accent); text-underline-offset:2px; overflow-wrap:anywhere; }

/* tables */
.bk-wrap { overflow-x:auto; }
table.bk { width:100%; border-collapse:collapse; font-size:.9rem; border-top:2px solid var(--ink); border-bottom:2px solid var(--ink); }
.bk th { text-align:left; font:600 .68rem/1.2 var(--sans); text-transform:uppercase; letter-spacing:.1em; color:var(--muted); padding:8px 10px; border-bottom:1px solid var(--ink); white-space:nowrap; }
.bk th button { background:none; border:0; padding:0; font:inherit; text-transform:inherit; letter-spacing:inherit; color:inherit; }
.bk th button[aria-pressed="true"] { color:var(--ink); }
.bk td { padding:7px 10px; border-bottom:1px solid var(--rule); vertical-align:middle; }
.bk tr:last-child td { border-bottom:0; }
.bk td.t { font-family:var(--serif); font-size:1rem; min-width:200px; }
.bk tbody tr { cursor:pointer; } .bk tbody tr:hover { background:var(--accent-soft); }
.bk .num { font-variant-numeric:tabular-nums; white-space:nowrap; }
.tcell { display:flex; flex-wrap:wrap; gap:3px; }
.tcell .tag { font-weight:500; }
.grouph td { background:var(--accent-soft); font:600 .78rem var(--sans); letter-spacing:.06em; text-transform:uppercase; color:var(--accent); cursor:default !important; }
.toolbar { display:flex; flex-wrap:wrap; gap:8px 14px; align-items:center; justify-content:space-between; margin-bottom:12px; }
.toolbar input[type=search] { padding:6px 12px; border:1px solid var(--rule); border-radius:6px; background:var(--surface); min-width:200px; }

/* reader (drawer) */
#drawer { position:fixed; top:0; right:0; bottom:0; width:min(560px,100vw); background:var(--surface); border-left:1px solid var(--ink); box-shadow:-8px 0 32px rgba(0,0,0,.18); z-index:50; display:flex; flex-direction:column; }
#drawer .dh { display:flex; gap:8px; align-items:center; justify-content:space-between; padding:10px 16px; border-bottom:1px solid var(--rule); }
#drawer .db { overflow-y:auto; padding:18px 22px 40px; display:flex; flex-direction:column; gap:16px; }
.dt { font:400 1.7rem/1.2 var(--serif); margin:0; text-wrap:balance; }
.dmeta { display:flex; flex-wrap:wrap; gap:4px 10px; align-items:center; font-size:.84rem; color:var(--muted); }
.dacts { display:flex; flex-wrap:wrap; gap:8px; }
.dlinks h4 { font:600 .7rem/1 var(--sans); text-transform:uppercase; letter-spacing:.1em; color:var(--muted); margin:0 0 6px; }
.dlinks ul { list-style:none; margin:0 0 10px; padding:0; }
.dlinks li { padding:3px 0; font-family:var(--serif); }
.dlinks li button { background:none; border:0; padding:0; color:var(--accent); text-align:left; text-underline-offset:2px; text-decoration:underline; font:inherit; }
.dlinks li .why { font:400 .76rem var(--sans); color:var(--muted); margin-left:6px; }
.ilink { color:var(--accent); text-underline-offset:2px; cursor:pointer; }
.ilink.bad { color:var(--bad); text-decoration:underline dotted; }
.scrim { display:none; }
@media (max-width:860px) { .scrim { display:block; position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:40; } }

/* rendered Notion body */
.back { font:400 1.12rem/1.6 var(--serif); max-width:68ch; }
.back p { margin:0 0 .7em; } .back ul,.back ol { margin:0 0 .7em; padding-left:1.3em; }
.back code { font:.88em/1.4 ui-monospace,"SF Mono",Menlo,Consolas,monospace; background:var(--accent-soft); padding:0 4px; border-radius:3px; }
.back pre { overflow-x:auto; background:var(--accent-soft); padding:10px 14px; border-radius:4px; margin:0 0 .8em; }
.back pre code { background:none; padding:0; }
.back h4 { font:600 1rem var(--serif); margin:.6em 0 .3em; }
.back blockquote { margin:0 0 .7em; padding-left:12px; border-left:2px solid var(--rule); color:var(--muted); }
.back hr { border:0; border-top:1px solid var(--rule); margin:.8em 0; }
.back table { border-collapse:collapse; margin-bottom:.8em; font-size:.95rem; }
.back td,.back th { border:1px solid var(--rule); padding:3px 8px; text-align:left; }
.back a { color:var(--accent); text-underline-offset:2px; }
.tex { font-family:var(--serif); font-style:italic; } .tex.ok { font-style:normal; }
.tex.disp { display:block; text-align:center; margin:.4em 0 .9em; overflow-x:auto; overflow-y:hidden; }
.tex mjx-container { margin:0 !important; } .tex.disp mjx-container { display:inline-block !important; } .tex mjx-container svg { max-width:100%; }
mjx-assistive-mml { position:absolute !important; top:0; left:0; clip:rect(1px,1px,1px,1px); user-select:none; padding:1px 0 0 0 !important; border:0 !important; display:block; width:auto; overflow:hidden; }
.c-gray{color:var(--muted)} .c-brown{color:#8B5E3C} .c-orange{color:#C2581A} .c-yellow{color:#A87F00} .c-green{color:var(--ok)} .c-blue{color:var(--accent)} .c-purple{color:#7041B0} .c-pink{color:#B5367A} .c-red{color:var(--bad)}
[class^="bg-"]{background:var(--accent-soft);padding:0 3px;border-radius:2px} .bg-red{background:var(--bad-bg)} .bg-yellow,.bg-orange{background:var(--warn-bg)} .bg-green{background:var(--ok-bg)}
.tags { display:flex; flex-wrap:wrap; gap:4px 12px; margin-top:6px; font:400 .82rem var(--sans); color:var(--muted); }
.tags button { background:none; border:0; padding:0; color:var(--muted); } .tags button:hover { color:var(--accent); text-decoration:underline; }
.skel { color:var(--muted); }

/* flashcards */
.card { background:var(--surface); border:1px solid var(--rule); border-radius:6px; padding:24px 28px 18px; display:flex; flex-direction:column; gap:20px; min-height:320px; touch-action:pan-y; will-change:transform; }
.card.covered { min-height:0; }
.card.flippable { cursor:pointer; -webkit-tap-highlight-color:transparent; } .card.flippable:focus { outline:none; }
.card.flippable:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
.card .back-wrap { border-top:1px solid var(--rule); padding-top:18px; }
.card-head { display:flex; flex-wrap:wrap; gap:8px 16px; justify-content:space-between; align-items:center; font-size:.85rem; color:var(--muted); }
.meta2 { display:flex; flex-wrap:wrap; gap:4px 10px; align-items:center; }
.front { font:400 clamp(1.5rem,3.2vw,2rem)/1.25 var(--serif); margin:4px 0 0; text-wrap:balance; }
.actions { margin-top:auto; }
.rates { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; }
.rate { background:none; border:1px solid; border-radius:6px; padding:9px 8px; display:flex; flex-direction:column; align-items:center; gap:1px; }
.rate b { font-weight:600; } .rate small { font-size:.75rem; opacity:.85; }
.rate.fail{color:var(--bad);border-color:var(--bad)} .rate.unsure{color:var(--warn);border-color:var(--warn)} .rate.know{color:var(--ok);border-color:var(--ok)}
.rate.fail:hover{background:var(--bad-bg)} .rate.unsure:hover{background:var(--warn-bg)} .rate.know:hover{background:var(--ok-bg)}
.foot { display:flex; flex-wrap:wrap; gap:4px 16px; justify-content:space-between; font-size:.78rem; color:var(--muted); padding-top:10px; border-top:1px solid var(--rule); }
.foot a { color:var(--accent); }
.deckbar { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:10px; }
.prog { display:flex; align-items:center; gap:8px; font-variant-numeric:tabular-nums; }
.prog .t { width:96px; height:4px; background:var(--rule); } .prog .t i { display:block; height:100%; background:var(--accent); }
.navs { display:flex; gap:8px; align-items:center; }
.navb { width:36px; height:34px; display:inline-flex; align-items:center; justify-content:center; background:var(--surface); border:1px solid var(--rule); border-radius:6px; font-size:1.1rem; line-height:1; }
.navb:hover:not(:disabled) { border-color:var(--accent); color:var(--accent); } .navb:disabled { opacity:.35; cursor:default; }
.shuffle { display:inline-flex; align-items:center; gap:6px; background:var(--surface); border:1px solid var(--accent); color:var(--accent); border-radius:6px; padding:6px 14px; font-weight:600; }
.shuffle:hover { background:var(--accent-soft); } .shuffle svg { width:16px; height:16px; }
.box { background:var(--surface); border:1px solid var(--rule); border-radius:6px; padding:24px 28px; text-align:center; display:flex; flex-direction:column; gap:14px; align-items:center; justify-content:center; min-height:200px; }
.box h3 { font:italic 400 1.5rem var(--serif); margin:0; } .box p { margin:0; max-width:54ch; color:var(--muted); overflow-wrap:anywhere; }
.btnrow { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; }

/* ============ Markdown Notion -> HTML (dal vecchio Studio Atomi, + link interni) ============ */

/* ordine coerente: i prerequisiti (atomi citati) prima di chi li cita; a parità, tipologia e alfabeto */
function orderAtoms(list) {
  const base = list.slice().sort((a, b) => tipoRank(a.tipo) - tipoRank(b.tipo) || collator.compare(a.titolo, b.titolo));
  if (!L.out.size || base.length < 2) return base;
  const ids = new Set(base.map((a) => a.id)), pre = new Map();
  base.forEach((a) => pre.set(a.id, new Set(outLinks(a.id).map((l) => l.to).filter((t) => ids.has(t) && t !== a.id))));
  const res = [], done = new Set(); let left = base.slice();
  while (left.length) {
    let best = -1, bestN = 1e9;
    for (let i = 0; i < left.length; i++) {
      let n = 0; pre.get(left[i].id).forEach((p) => { if (!done.has(p)) n++; });
      if (n < bestN) { bestN = n; best = i; if (!n) break; }
    }
    const a = left.splice(best, 1)[0]; res.push(a); done.add(a.id);
  }
  return res;
}
