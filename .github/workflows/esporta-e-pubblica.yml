name: Esporta da Notion e pubblica

on:
  schedule:
    - cron: "23 */3 * * *"      # ogni 3 ore
  workflow_dispatch:
    inputs:
      full:
        description: "Rileggi tutti i corpi degli atomi, anche se non modificati"
        type: boolean
        default: false
  push:
    branches: [main]
    paths-ignore: ["data/**"]   # le modifiche all'app ripubblicano il sito senza rileggere Notion

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: astrobit-pages
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Esporta da Notion
        if: github.event_name != 'push'
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          FULL: ${{ inputs.full && '1' || '0' }}
        run: node scripts/export-notion.mjs

      - name: Salva i dati nel repository
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Dati invariati."
          else
            git commit -m "dati: esportazione da Notion"
            git push
          fi

      - name: Prepara il sito
        run: |
          mkdir _site
          cp index.html _site/
          if [ -d data ]; then cp -r data _site/data; fi
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: export
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
